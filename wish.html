<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Special Message</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 30px;
      padding: 60px 40px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 100%;
      animation: slideIn 0.6s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      color: #764ba2;
      font-size: 3rem;
      margin-bottom: 20px;
      font-weight: 700;
    }

    .question {
      font-size: 1.8rem;
      color: #333;
      margin: 30px 0;
      font-weight: 500;
    }

    .hearts {
      font-size: 4rem;
      margin: 20px 0;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.2);
      }
    }

    .buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-top: 40px;
    }

    button {
      padding: 15px 40px;
      font-size: 1.2rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    #yesBtn {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
    }

    #yesBtn:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
    }

    #noBtn {
      background: #e0e0e0;
      color: #666;
      position: relative;
    }

    #noBtn:hover {
      background: #d0d0d0;
    }

    .celebration {
      display: none;
    }

    .celebration.show {
      display: block;
      animation: fadeIn 0.5s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .woohoo {
      font-size: 4rem;
      color: #f5576c;
      font-weight: 700;
      margin: 20px 0;
      animation: bounce 0.6s ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      25% { transform: translateY(-20px); }
      50% { transform: translateY(0); }
      75% { transform: translateY(-10px); }
    }

    .decision {
      font-size: 1.5rem;
      color: #764ba2;
      margin: 20px 0;
      font-weight: 600;
    }

    .smiley {
      font-size: 3rem;
      margin: 10px 0;
    }

    .love-message {
      font-size: 2rem;
      color: #f5576c;
      margin-top: 30px;
      font-weight: 600;
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .gif-container {
      margin: 30px 0;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .gif-container img {
      width: 100%;
      max-width: 400px;
      height: auto;
      display: block;
    }

    @media (max-width: 600px) {
      .container {
        padding: 40px 25px;
      }

      h1 {
        font-size: 2rem;
      }

      .question {
        font-size: 1.3rem;
      }

      .hearts {
        font-size: 3rem;
      }

      .buttons {
        flex-direction: column;
        gap: 15px;
      }

      button {
        width: 100%;
      }

      .woohoo {
        font-size: 3rem;
      }

      .decision {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="question-section">
      <h1>Jebsiya.!</h1>
      <div class="hearts">💕💕</div>
      <p class="question">Will you be my velantine?</p>
      
      <div class="buttons">
        <button id="yesBtn">Yes</button>
        <button id="noBtn">No</button>
      </div>
    </div>

    <div id="celebration" class="celebration">
      <div class="woohoo">Woohoo!!!</div>
      <div class="decision">Best Decision Ever! 😊</div>
      
      <div class="gif-container">
        <img src="messi.gif" alt="Celebration">
      </div>
      
      <div class="love-message">I Love You! ❤️</div>
    </div>
  </div>

  <script>
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const questionSection = document.getElementById('question-section');
    const celebration = document.getElementById('celebration');

    const funnyMessages = [
      { title: "Wrong answer!", text: "Try again! 😜", icon: "error" },
      { title: "Oops!", text: "That button is broken! 😅", icon: "warning" },
      { title: "Think again!", text: "Are you sure? 💭", icon: "question" },
      { title: "Nice try!", text: "But that's not an option! 😂", icon: "info" },
      { title: "Out of order!", text: "The No button is broken! 🚫", icon: "error" },
      { title: "Error 404", text: "No not found! 😄", icon: "error" },
      { title: "Really?", text: "Give it another thought! 🤔", icon: "question" },
      { title: "Nope!", text: "Only Yes works here! 💝", icon: "warning" }
    ];

    let noClickCount = 0;

    noBtn.addEventListener('click', function() {
      const randomMessage = funnyMessages[Math.floor(Math.random() * funnyMessages.length)];
      Swal.fire({
        title: randomMessage.title,
        text: randomMessage.text,
        icon: randomMessage.icon,
        confirmButtonColor: '#764ba2',
        confirmButtonText: 'Okay!'
      });
      
      // Make the No button move around on mobile/desktop
      noClickCount++;
      if (noClickCount > 2) {
        const maxX = window.innerWidth - noBtn.offsetWidth - 100;
        const maxY = window.innerHeight - noBtn.offsetHeight - 100;
        const randomX = Math.random() * maxX;
        const randomY = Math.random() * maxY;
        
        noBtn.style.position = 'fixed';
        noBtn.style.left = randomX + 'px';
        noBtn.style.top = randomY + 'px';
      }
    });

    yesBtn.addEventListener('click', function() {
      questionSection.style.display = 'none';
      celebration.classList.add('show');
      
      // Add confetti effect
      createConfetti();
    });

    function createConfetti() {
      const colors = ['#f093fb', '#f5576c', '#4facfe', '#ffd89b'];
      for (let i = 0; i < 50; i++) {
        const confetti = document.createElement('div');
        confetti.style.position = 'fixed';
        confetti.style.width = '10px';
        confetti.style.height = '10px';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.left = Math.random() * window.innerWidth + 'px';
        confetti.style.top = '-10px';
        confetti.style.borderRadius = '50%';
        confetti.style.pointerEvents = 'none';
        confetti.style.zIndex = '9999';
        document.body.appendChild(confetti);
        
        const animation = confetti.animate([
          { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
          { transform: `translateY(${window.innerHeight + 10}px) rotate(${Math.random() * 360}deg)`, opacity: 0 }
        ], {
          duration: Math.random() * 3000 + 2000,
          easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
        });
        
        animation.onfinish = () => confetti.remove();
      }
    }
  </script>
</body>
</html>
